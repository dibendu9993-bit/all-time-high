name: Daily NSE+BSE Breakout Scan

# Runs automatically every weekday at 4:05 PM IST (10:35 UTC), shortly after
# the 3:30 PM market close. You can also trigger it manually anytime from
# the "Actions" tab on GitHub using the "Run workflow" button.
on:
  schedule:
    - cron: '35 10 * * 1-5'
  workflow_dispatch: {}

# Lets this workflow push the updated dashboard back into your own repo.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run the breakout screener
        run: python nse_bse_breakout_screener.py

      - name: Publish today's dashboard
        run: |
          git config user.name "breakout-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html output cache
          git diff --quiet --cached || git commit -m "Daily scan: $(date -u +'%Y-%m-%d')"
          git push
